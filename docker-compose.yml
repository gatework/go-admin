services:
  motor-api:
    container_name: motor
    image: motor:latest
    # ping, mtr and traceroute open raw sockets. NET_RAW is in Docker's
    # default set; it is named so that a hardened runtime keeps it.
    cap_add:
      - NET_RAW
    restart: always
    ports:
      - 8000:8000
    # Compose allows 10 seconds by default, and this process spends
    # drain + server + cleanup from extend.shutdown before it exits - 8 out of
    # the box, more for anyone who configures a drain window. Past the deadline
    # it is sent SIGKILL and the cleanup callbacks are cut off part-way
    # through. checksilent's docker-stop-cuts-shutdown-short check compares
    # this against config/settings.yml.
    stop_grace_period: 30s
    # The image runs /motor from /, so its relative paths resolve under /.
    volumes:
      - ./config/:/config/
      - ./static/:/static/
      - ./temp/:/temp/
      - ./data/:/data/  # firewall snapshots (FIREWALL_SNAPSHOT_DIR, default data/firewall)
    networks:
      - myweb
networks:
  myweb:
    driver: bridge

