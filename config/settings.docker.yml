settings:
  application:
    mode: dev
    host: 0.0.0.0
    name: motor
    port: 8000
    readtimeout: 30
    writertimeout: 30
    enabledp: false
  logger:
    path: temp/logs
    stdout: default
    level: debug
    enableddb: true
  jwt:
    secret: motor-docker-development-only
    timeout: 3600
  database:
    driver: postgres
    source: host=postgres port=5432 user=motor password=motor dbname=motor_development sslmode=disable TimeZone=Asia/Shanghai
    maxIdleConns: 10
    maxOpenConns: 30
    connMaxLifeTime: 3600
  gen:
    dbname: motor_development
    frontpath: ../go-admin-ui/src
  extend:
    rateLimit:
      inboundQPS: 200
    shutdown:
      drain: 0
      server: 5
      cleanup: 3
      grace: 30
  cache:
    redis:
      addr: redis:6379
      db: 0
  queue:
    redis:
      addr: redis:6379
      db: 1
      group: motor
      key_prefix: motor
      max_attempts: 5
