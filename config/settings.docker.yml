settings:
  application:
    mode: dev
    host: 0.0.0.0
    name: motor
    port: 8000
    # 秒。readtimeout 覆盖整个请求体的读取，需容纳最大的上传（防火墙配置导入）；
    # writertimeout 从读完请求头算起，需长于最慢的同步接口（Netdisco 同步约 25 秒、导出）。
    # 超时后连接被关闭，客户端拿不到响应。
    readtimeout: 60
    writertimeout: 60
    enabledp: false
  logger:
    path: temp/logs
    stdout: default
    level: debug
    enableddb: true
  jwt:
    secret: motor-docker-development-only
    timeout: 3600
  database:
    driver: postgres
    source: host=postgres port=5432 user=motor password=motor dbname=motor_development sslmode=disable TimeZone=Asia/Shanghai
    maxIdleConns: 10
    maxOpenConns: 30
    connMaxLifeTime: 3600
  gen:
    dbname: motor_development
    frontpath: ../go-admin-ui/src
  extend:
    rateLimit:
      inboundQPS: 200
    shutdown:
      drain: 0
      server: 5
      cleanup: 3
      grace: 30
  cache:
    redis:
      addr: redis:6379
      db: 0
  queue:
    redis:
      addr: redis:6379
      db: 1
      group: motor
      key_prefix: motor
      max_attempts: 5
